[workspace]
resolver = "2"
members = ["crates/livedaw-dsp", "crates/livedaw-recorder", "crates/livedaw-engine", "crates/livedaw-session", "crates/livedaw-wing", "crates/livedaw-x32", "crates/livedaw-promix", "crates/livedaw-02r", "crates/livedaw-ffi", "crates/livedaw-web"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.83"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1
