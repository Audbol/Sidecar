[package]
name = "livedaw-ffi"
description = "C ABI for the Sidecar engine (linked into the JUCE app)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "livedaw_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
livedaw-engine = { path = "../livedaw-engine" }
livedaw-dsp = { path = "../livedaw-dsp" }
livedaw-session = { path = "../livedaw-session" }
livedaw-wing = { path = "../livedaw-wing" }
livedaw-x32 = { path = "../livedaw-x32" }
livedaw-02r = { path = "../livedaw-02r" }
livedaw-01v = { path = "../livedaw-01v" }
livedaw-sq = { path = "../livedaw-sq" }
livedaw-dm2000 = { path = "../livedaw-dm2000" }
livedaw-ahmidi = { path = "../livedaw-ahmidi" }
livedaw-promix = { path = "../livedaw-promix" }
livedaw-web = { path = "../livedaw-web" }
