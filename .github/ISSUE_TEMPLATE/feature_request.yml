name: Feature request
description: Suggest something Sidecar should do (or do more like a real console)
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Describe the feature and how you would use it at a show or in rehearsal.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: How does the real console do it?
      description: If this is console behaviour Sidecar lacks or does differently, name the console and describe how it behaves (firmware version, screen, manual section). Please don't attach copies of any maker's manuals or software.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you use instead today.
